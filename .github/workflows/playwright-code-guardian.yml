name: Playwright Code Guardian Review

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'tests/**'
      - '**/*.spec.ts'
      - '**/*.spec.js'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            tests/**
            **/*.spec.ts
            **/*.spec.js

      - name: Run AI Review
        if: steps.changed-files.outputs.any_changed == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          npm install @google/genai

          node -e "
          const fs = require('fs');
          const { GoogleGenAI } = require('@google/genai');
          
          const ai = new GoogleGenAI({ apiKey: process.env.GEMINI_API_KEY });
          const files = process.env.CHANGED_FILES.split(' ');
          
          let codeContent = '';
          files.forEach(file => {
            if (fs.existsSync(file)) {
              codeContent += \`\n--- File: \${file} ---\n\` + fs.readFileSync(file, 'utf8');
            }
          });

          if (!codeContent) {
            fs.writeFileSync('review_result.md', 'No spec files modified.');
            process.exit(0);
          }

          const systemPrompt = \`Act as 'Playwright Code Guardian', a Senior Test Automation Reviewer.
          Review the following Playwright code for:
          1. Locator Health (prefer getByRole, getByTestId over long XPath/CSS).
          2. Async & Waiting (flag missing await, remove waitForTimeout).
          3. Curriculum Alignment (reference modules like B13, B16, I11, S10).
          4. Provide complete refactored code snippets.\`;

          async function run() {
            try {
              const response = await ai.models.generateContent({
                model: 'gemini-3.6-flash',
                contents: systemPrompt + '\n\nCode to review:\n' + codeContent,
              });
              fs.writeFileSync('review_result.md', response.text);
            } catch (err) {
              console.error(err);
              process.exit(1);
            }
          }
          run();
          "

      - name: Post Review Comment on Pull Request
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            if (fs.existsSync('review_result.md')) {
              const reviewText = fs.readFileSync('review_result.md', 'utf8');
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## 🛡️ Playwright Code Guardian Review\n\n${reviewText}`
              });
            }
